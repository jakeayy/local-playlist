# Keeps the actions in .github/workflows up to date; they're pinned to commit
# SHAs with the version in a comment, which Dependabot updates together.
# Rust dependencies get security updates only (a repository setting), not
# routine version bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
