# Releases: builds everything (see build.yml: desktop app and server for Linux
# and Windows) and publishes it as the release v<version>, the version being
# Cargo.toml's. Runs when a push to main bumps that version, or by hand
# (Actions → Release → Run workflow). The development pre-release (see
# dev.yml) is removed, since the release supersedes it. The Docker image
# ghcr.io/<owner>/<repo> is tagged <version>, latest and dev.

name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1; }
          now=$(version < Cargo.toml)
          echo "version=$now" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            release=true
          else
            # The commit before this push (or the parent, for a new branch / forced push).
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; else base=HEAD^; fi
            before=$(git show "$base:Cargo.toml" 2>/dev/null | version || true)
            echo "version: ${before:-none} -> $now"
            if [ "$before" != "$now" ]; then release=true; else release=false; fi
          fi
          if [ "$release" = true ] && git rev-parse -q --verify "refs/tags/v$now" >/dev/null; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::v$now is already released. Bump the version in Cargo.toml first."
              exit 1
            fi
            echo "v$now already exists; nothing to release."
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ needs.check.outputs.version }}

  publish:
    name: Publish release
    # Creates and deletes releases.
    permissions:
      contents: write
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The downloads table, then the changes since the last release
          # (generated by GitHub and appended).
          .github/release-downloads.sh "$TAG" > notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --latest \
            --title "Local Playlist $VERSION" --notes-file notes.md --generate-notes

          # The release supersedes the development pre-release.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("dev-"))) | .tagName' |
            while read -r old; do
              echo "Removing $old"
              gh release delete "$old" --cleanup-tag --yes
            done

  # A job of its own so a failed push can be re-run without publishing again.
  docker:
    name: Publish Docker image
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux-x64-server
          path: dist

      # `dev` too: like the pre-release, the dev image is superseded by the release.
      - name: Push ghcr.io image (version, latest, dev)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: .github/docker-publish.sh "$VERSION" "$VERSION" latest dev
