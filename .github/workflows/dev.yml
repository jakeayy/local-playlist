# Development builds: every push to main that changes the code is built (see
# build.yml: desktop app and server for Linux and Windows) and published as
# the pre-release `dev-<commit>`, replacing the previous one, and as the Docker
# image ghcr.io/<owner>/<repo>:dev. A push that bumps the version in Cargo.toml
# is left to release.yml, which publishes v<version>.

name: Dev build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "web/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dev.yml"
      - ".github/workflows/build.yml"
      - ".github/release-downloads.sh"
      - ".github/docker-publish.sh"
      - "Dockerfile"

# A newer push supersedes a build still running.
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check for a version bump
    runs-on: ubuntu-24.04
    outputs:
      bump: ${{ steps.check.outputs.bump }}
      label: ${{ steps.check.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1; }
          now=$(version < Cargo.toml)
          # The commit before this push (or the parent, for a new branch / forced push).
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; else base=HEAD^; fi
          before=$(git show "$base:Cargo.toml" 2>/dev/null | version || true)
          echo "version: ${before:-none} -> $now"
          if [ "$before" != "$now" ]; then
            echo "Version bump: release.yml publishes this push."
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
          echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.bump == 'false'
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ needs.check.outputs.label }}

  publish:
    name: Publish pre-release
    # Creates and deletes releases.
    permissions:
      contents: write
    needs: [check, build]
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.label }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A release may already contain this commit (a version bump pushed
          # meanwhile): then this build is out of date.
          latest=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$latest" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest" 2>/dev/null; then
            echo "Release $latest already includes $GITHUB_SHA; not publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "Development build of ${GITHUB_SHA::7} on \`main\`. It may be unstable; the latest release is under Releases."
            echo
            .github/release-downloads.sh "$TAG"
            echo
            echo "### Changes"
            echo
            echo "$MESSAGE"
          } > notes.md
          gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build ${GITHUB_SHA::7}" --notes-file notes.md
          echo "published=true" >> "$GITHUB_OUTPUT"

          # Only the newest development build is kept.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("dev-"))) | .tagName' |
            while read -r old; do
              if [ "$old" != "$TAG" ]; then
                echo "Removing $old"
                gh release delete "$old" --cleanup-tag --yes
              fi
            done

  # A job of its own so a failed push can be re-run without publishing again.
  docker:
    name: Publish Docker image
    needs: [check, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux-x64-server
          path: dist

      - name: Push ghcr.io image (dev)
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.check.outputs.label }}
        run: .github/docker-publish.sh "$LABEL" dev
