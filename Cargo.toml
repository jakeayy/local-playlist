[package]
name = "local-playlist"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "local-playlist"

[lib]
path = "src/lib.rs"

[[bin]]
name = "local-playlist"
path = "src/main.rs"

# Webview login window, started by the app. A separate executable so the app
# itself never loads the webview libraries (WebKitGTK/GTK on Linux).
[[bin]]
name = "local-playlist-login"
path = "src/bin/login.rs"
required-features = ["desktop"]

[features]
# The server embeds the 6 MB web UI, so desktop builds leave it out unless
# asked for: `cargo build --release --features server` builds both.
default = ["desktop"]
# The GPUI interface (desktop app and browser build).
ui = ["dep:gpui-kit", "dep:image"]
# Native desktop app: audio output, webview login, system keyring.
desktop = ["ui", "dep:rodio", "dep:wry", "dep:tao", "dep:keyring", "dep:chacha20poly1305", "dep:lofty", "dep:memmap2", "dep:futures", "dep:ksni", "dep:windows", "dep:flate2", "dep:md-5"]
# `--server`: web UI + API. Build only this for a slim server binary:
#   cargo build --release --no-default-features --features server
server = ["dep:tiny_http", "dep:rpassword"]

[dependencies]
anyhow = "1.0.104"
gpui-kit = { version = "0.9.1", features = ["gpui-fast"], optional = true }
# Cover art trimming; already built for GPUI (same version), so no extra weight.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

# Shared by the desktop app and the server.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
directories = "6.0.0"
getrandom = "0.4.3"
sha1_smol = "1.0.1"
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["json"] }
# Only deflate decompression is needed (yt-dlp builds, wheels), with the
# miniz backend other crates already use (zlib-rs would add a second one).
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
# desktop
chacha20poly1305 = { version = "0.11.0", optional = true }
# Channel from the tray icon's thread to the UI (already built for GPUI).
futures = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
keyring = { version = "4.2.0", optional = true }
# Soulseek (`soulseek.rs`): search results come zlib-compressed (the miniz
# backend zip already builds), and the login carries an MD5 of the
# credentials (md-5 is already built for GPUI's secret-service client).
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"], optional = true }
md-5 = { version = "0.10.6", optional = true }
# Cover art in downloaded files (pure Rust, no ffmpeg).
lofty = { version = "0.22.4", optional = true }
# Remuxing downloads without reading them into memory (already built for GPUI's fonts).
memmap2 = { version = "0.9.12", optional = true }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-vorbis", "symphonia-flac", "symphonia-wav"], optional = true }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
# server
rpassword = { version = "7.5.5", optional = true }
tiny_http = { version = "0.12.0", optional = true }

# Tray icon (desktop): a StatusNotifierItem over D-Bus, without GTK. Its D-Bus
# library (zbus on async-io) is already built for GPUI's Linux backend.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"], optional = true }

# Tray icon (desktop): the `windows` crate GPUI's Windows backend builds,
# with features it already enables.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }

# Browser build (see scripts/build-web.sh).
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Headers", "HtmlAudioElement", "HtmlMediaElement", "Location", "MediaError", "Request", "RequestInit", "RequestMode", "Response", "Storage", "Window"] }

[profile.release]
# Optimised for size: about a quarter smaller than opt-level 3 (31.7 vs 43.5 MB
# for the desktop app), and nothing here is CPU-bound enough to notice.
# Whole-program optimisation: smaller and at least as fast, at the cost of
# slower release builds. Unwinding is kept so a panicking server worker
# thread doesn't take the whole server down.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Browser build: favour size (the .wasm is downloaded by every visitor, and
# embedded in the server). "z" with `wasm-opt -Oz` is ~11% smaller than "s".
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# wasm-bindgen needs the target_features section; wasm-opt strips the rest.
strip = false
