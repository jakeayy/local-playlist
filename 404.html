<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Local Playlist</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/local-playlist/img/icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #FEF7FF; --fg: #1D1B20; --muted: #49454F; --primary: #6750A4; --on-primary: #fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141218; --fg: #E6E0E9; --muted: #CAC4D0; --primary: #D0BCFF; --on-primary: #381E72; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #141218; --fg: #E6E0E9; --muted: #CAC4D0; --primary: #D0BCFF; --on-primary: #381E72; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font: 16px/1.6 "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; text-align: center; }
  img { margin: 0 auto 20px; border-radius: 18px; }
  h1 { margin: 0; font-size: 28px; }
  p { color: var(--muted); }
  a.btn { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 999px; background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 500; }
</style>
<script>try { var t = localStorage.getItem('lp-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <main>
    <!-- Root-relative links: GitHub Pages serves this page for any missing path, at any depth. -->
    <img src="/local-playlist/img/icon.svg" width="80" height="80" alt="">
    <h1>This track isn't in the playlist</h1>
    <p>The page you were looking for doesn't exist.</p>
    <a class="btn" href="/local-playlist/">Back to Local Playlist</a>
  </main>
</body>
</html>
